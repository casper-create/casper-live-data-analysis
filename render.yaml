services:
  - type: web
    name: casper-live-data-analysis
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DERIV_CLIENT_ID
        sync: false
      - key: DERIV_REDIRECT_URI
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: CASPER_PREMIUM_OWNER_IDS
        sync: false
